name: Build OpenFlux unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Clone OpenFlux v0.2.0
        run: |
          git clone --depth 1 --branch v0.2.0 \
            https://github.com/p1neappleXpress/OpenFlux.git \
            OpenFlux

      - name: Install Go
        run: |
          brew install go
          go version

      - name: Install xcodegen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Build Go iOS library
        working-directory: OpenFlux
        run: |
          chmod +x build_ios.sh
          ./build_ios.sh

      - name: Sync library into iOS app
        working-directory: OpenFlux
        run: |
          mkdir -p ios-app/Lib

          cp output/ios/liboflux.a ios-app/Lib/liboflux.a

          echo "=== Lib contents ==="
          ls -lah ios-app/Lib

      - name: Generate Xcode project
        working-directory: OpenFlux/ios-app
        run: |
          xcodegen generate

      - name: Build unsigned iOS app
        working-directory: OpenFlux/ios-app
        run: |
          xcodebuild \
            -project OpenFlux.xcodeproj \
            -scheme OpenFlux \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Show build output
        if: always()
        working-directory: OpenFlux/ios-app
        run: |
          echo "=== Build products ==="
          find build/Build/Products -maxdepth 2 -type d -name "*.app" -print || true

      - name: Package IPA
        working-directory: OpenFlux/ios-app
        run: |
          mkdir -p ../../Payload

          cp -R \
            build/Build/Products/Release-iphoneos/OpenFlux.app \
            ../../Payload/OpenFlux.app

          cd ../..

          zip -r OpenFlux-v0.2.0-unsigned.ipa Payload

          echo "=== IPA created ==="
          ls -lh OpenFlux-v0.2.0-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlux-v0.2.0-unsigned
          path: OpenFlux-v0.2.0-unsigned.ipa
          if-no-files-found: error
