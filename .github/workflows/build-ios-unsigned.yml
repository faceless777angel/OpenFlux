name: Build OpenFlux unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Clone OpenFlux v0.2.0
        run: |
          git clone --depth 1 --branch v0.2.0 \
            https://github.com/p1neappleXpress/OpenFlux.git \
            OpenFlux

      - name: Install Go
        run: |
          brew install go
          go version

      - name: Install xcodegen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Build unsigned iOS app
        working-directory: OpenFlux
        run: |
          chmod +x build_ios_app.sh
          chmod +x build_ios.sh

          ./build_ios.sh

          cd ios-app
          xcodegen generate

          xcodebuild \
            -project OpenFlux.xcodeproj \
            -scheme OpenFlux \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package IPA
        working-directory: OpenFlux
        run: |
          mkdir -p Payload

          cp -R \
            ios-app/build/Build/Products/Release-iphoneos/OpenFlux.app \
            Payload/OpenFlux.app

          zip -r OpenFlux-v0.2.0-unsigned.ipa Payload

      - name: Verify IPA
        working-directory: OpenFlux
        run: |
          echo "=== IPA ==="
          ls -lh OpenFlux-v0.2.0-unsigned.ipa

          echo "=== App ==="
          find ios-app/build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlux-v0.2.0-unsigned
          path: OpenFlux/OpenFlux-v0.2.0-unsigned.ipa
          if-no-files-found: error
