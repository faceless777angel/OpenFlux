name: Build OpenFlux unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Clone OpenFlux v0.2.0
        run: |
          git clone --depth 1 --branch v0.2.0 \
            https://github.com/p1neappleXpress/OpenFlux.git \
            OpenFlux

      - name: Show version
        working-directory: OpenFlux
        run: |
          git log -1 --oneline
          git describe --tags --always

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install xcodegen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Build iOS app
        working-directory: OpenFlux
        run: |
          chmod +x build_ios_app.sh
          ./build_ios_app.sh

      - name: Find IPA
        if: always()
        run: |
          echo "=== IPA files ==="
          find OpenFlux -type f -name "*.ipa" -print || true

          echo "=== APP files ==="
          find OpenFlux -type d -name "*.app" -print || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlux-v0.2.0-IPA
          path: "OpenFlux/**/*.ipa"
          if-no-files-found: error
